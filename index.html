<!DOCTYPE html>
<html lang="{{lang}}">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{title}}</title>
    <meta name="description" content="{{description}}" />
    <meta name="theme-color" content="{{themeColor}}" />
    <link rel="icon" type="image/svg+xml" href="./icon.svg" />
    {{manifest}}
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />

    <!--
        App configuration and exercises are classic scripts that set window.__TRAINER_*__
        globals, so the app also works from file:// (USB), where fetch() is unavailable.
        They are generated per app by scripts/build-app.mjs (build) and scripts/prepare-dev.mjs (dev).
    -->
    <script src="./config/app.js" defer vite-ignore></script>
    <script src="./config/subject.js" defer vite-ignore></script>
    <script src="./config/areas.js" defer vite-ignore></script>
    <script src="./config/themes.js" defer vite-ignore></script>
    <script src="./config/badges.js" defer vite-ignore></script>
    <script src="./data/exercises.js" defer vite-ignore></script>
</head>

<body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
</body>

</html>
