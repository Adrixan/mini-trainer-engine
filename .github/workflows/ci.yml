name: CI

on:
    push:
        branches: [main, develop]
    pull_request:
        branches: [main, develop]

permissions:
    contents: read

concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

jobs:
    verify:
        name: Lint, types, content, tests
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: "20"
                  cache: "npm"

            - run: npm ci

            - name: Lint
              run: npm run lint

            - name: Type check
              run: npm run typecheck

            # Validates the default config and every app under src/apps
            - name: Validate content
              run: npm run validate

            - name: Tests
              run: npm test

    build:
        name: Build all apps (USB and PWA)
        runs-on: ubuntu-latest
        needs: verify
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: "20"
                  cache: "npm"

            - run: npm ci

            - name: Build
              run: npm run build:all

            - uses: actions/upload-artifact@v4
              with:
                  name: dist
                  path: dist/
                  retention-days: 7
